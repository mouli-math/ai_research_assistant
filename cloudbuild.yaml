# cloudbuild.yaml — GCP Cloud Build CI/CD Pipeline
# Triggered on every push to the main branch.
# Steps: install-and-test → build → push → deploy

steps:
  # ── Step 1: Install & Run test suite ─────────────────────────────────────────
  # IMPORTANT: must use python:3.11 to match the Dockerfile base image.
  - name: "python:3.11-slim"
    id: "install-and-test"
    entrypoint: "bash"
    env:
      - 'OPENAI_API_KEY=mock-key-for-testing-purposes-only'
      - 'TAVILY_API_KEY=mock-key-for-testing-purposes-only'
    args:
      - "-c"
      - |
        pip install --no-cache-dir -r requirements.txt
        echo "[run]" > .coveragerc
        echo "omit = streamlit_app.py,api/main.py,mcp_server/server.py" >> .coveragerc
        python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=70

  # ── Step 2: Build Docker image ────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-build"
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/ai-agent-repo/research-agent:$BUILD_ID
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/ai-agent-repo/research-agent:latest
      - .
    waitFor:
      - install-and-test

  # ── Step 3: Push image to Artifact Registry ──────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-push"
    args:
      - push
      - --all-tags
      - asia-south1-docker.pkg.dev/$PROJECT_ID/ai-agent-repo/research-agent
    waitFor:
      - docker-build

  # ── Step 4: Deploy to Cloud Run ──────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "cloud-run-deploy"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - research-agent
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/ai-agent-repo/research-agent:$BUILD_ID
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      - --min-instances=0
      - --max-instances=10
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest
    waitFor:
      - docker-push

  # ── Step 5: Deploy Streamlit to Cloud Run ────────────────────────────────────
  # Reuses the SAME image built in docker-build (one Dockerfile, same as
  # docker-compose.yml uses for all three services) but overrides the
  # container's start command — equivalent to docker-compose's `command:`
  # override for the streamlit service.
  #
  # API_URL is resolved dynamically here rather than hardcoded: we look up
  # research-agent's live Cloud Run URL and pass it straight into the
  # `gcloud run deploy` call for research-ui in the same step. Using
  # entrypoint=bash lets us run a shell command (capture + reuse a value)
  # instead of a single fixed args list.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "streamlit-deploy"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        API_URL=$(gcloud run services describe research-agent \
          --region=asia-south1 \
          --format='value(status.url)')
        echo "Resolved research-agent URL: $$API_URL"

        gcloud run deploy research-ui \
          --image=asia-south1-docker.pkg.dev/$PROJECT_ID/ai-agent-repo/research-agent:$BUILD_ID \
          --region=asia-south1 \
          --platform=managed \
          --allow-unauthenticated \
          --port=8501 \
          --command=python \
          --args=-m,streamlit,run,streamlit_app.py,--server.port=8501,--server.address=0.0.0.0 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars=API_URL=$$API_URL,PYTHONPATH=/app
    waitFor:
      - cloud-run-deploy

# Store build logs in Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: "1200s"
